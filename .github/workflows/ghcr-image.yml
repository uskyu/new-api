name: Build GHCR Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional image tag suffix"
        required: false
        type: string
  push:
    branches:
      - videofix

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            CUSTOM_TAG="${{ github.event.inputs.tag }}"
          else
            CUSTOM_TAG="videofix"
          fi
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "custom_tag=$CUSTOM_TAG" >> $GITHUB_OUTPUT

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/new-api:${{ steps.tags.outputs.custom_tag }}
            ghcr.io/${{ github.repository_owner }}/new-api:${{ steps.tags.outputs.custom_tag }}-${{ steps.tags.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
